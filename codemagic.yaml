workflows:
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - 1013573246@qq.com
        notify:
          success: true
          failure: true

  android-web:
    name: Android + Web
    instance_type: linux_x2
    max_build_duration: 30
    # 不设 triggering：需要时在网页点 Start new build，选这条工作流
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
      - name: Build Web
        script: flutter build web --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/web/**
    publishing:
      email:
        recipients:
          - 1013573246@qq.com
        notify:
          success: true
          failure: true

  # iOS 需要 Apple 证书后再启用。没有证书时不要跑这个 workflow。
